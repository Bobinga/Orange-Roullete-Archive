<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jeu Flash</title>

  <!-- Ruffle -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #jeu {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    ruffle-player {
      width: 100%;
      height: 100%;
    }

    #fsBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button id="fsBtn">Plein écran</button>

  <div id="jeu"></div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      player.style.width = "100%";
      player.style.height = "100%";

      document.getElementById("jeu").appendChild(player)
      
      player.load("596354_roulette.swf");

      document.getElementById("fsBtn").addEventListener("click", () => {
        player.requestFullscreen();
      });
    });
  </script>

</body>
</html>
